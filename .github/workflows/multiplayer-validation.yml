name: Multiplayer validation
on:
  push:
    branches: [fix/multiplayer-social-20260930]
permissions:
  contents: write
concurrency:
  group: multiplayer-social-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused diagnostics
        run: |
          grep -nE 'frustumCulled|applyWorldTransforms|\.visible|cull' public/js/char/human.js | tail -40
          grep -nE 'duration|dur|cur =|case .ev.|bodybump' server/room.js public/js/media/playback.js | head -50
          grep -nE 'castRay|ray\(' public/js/core/physics.js
          sed -n '405,422p' public/js/game/gore.js
      - name: Reproduce targeted regressions
        continue-on-error: true
        run: node --no-warnings --loader ./tests/loader.mjs --test tests/*regressions.test.mjs > /tmp/red.log 2>&1 || { tail -70 /tmp/red.log; exit 1; }
      - name: Apply exact-match scoped corrections
        if: hashFiles('tools/apply-social-fixes.mjs') != ''
        run: node tools/apply-social-fixes.mjs
      - name: Validate modules and all tests
        run: |
          npm run check
          npm test > /tmp/unit.log 2>&1 || { tail -120 /tmp/unit.log; exit 1; }
          tail -10 /tmp/unit.log
          node --no-warnings --loader ./tests/loader.mjs --test tests/*regressions.test.mjs > /tmp/social.log 2>&1 || { cat /tmp/social.log; exit 1; }
          tail -9 /tmp/social.log
          npm run test:network > /tmp/network.log 2>&1 || { tail -35 /tmp/network.log; exit 1; }
          tail -8 /tmp/network.log
          npm run test:fire
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check
      - name: Real browser regressions
        if: hashFiles('tests/social-browser.mjs') != ''
        run: |
          npm install --prefix /tmp/browser-qa playwright --no-package-lock --no-audit --no-fund
          /tmp/browser-qa/node_modules/.bin/playwright install --with-deps chromium > /tmp/browser-install.log 2>&1
          node tests/social-browser.mjs
      - name: Publish verified corrections to isolated branch only
        if: hashFiles('tools/apply-social-fixes.mjs') != ''
        run: |
          test "$GITHUB_REF" = refs/heads/fix/multiplayer-social-20260930
          git diff --stat
          git add public/js public/css public/index.html server/room.js scripts/test-network.mjs tests package.json
          if ! git diff --cached --quiet; then
            git config user.name 'Multiplayer regression fixes'
            git config user.email '118855670+Luzbel33@users.noreply.github.com'
            git commit -m 'fix: validated multiplayer physics and social interactions'
            git push origin HEAD:refs/heads/fix/multiplayer-social-20260930
          fi
