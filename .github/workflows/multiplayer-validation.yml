name: Multiplayer validation
on:
  push:
    branches: [fix/multiplayer-social-20260930]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused source diagnostics
        run: |
          find public/js -maxdepth 2 -type f | sort
          find . -name AGENTS.md -o -name CLAUDE.md
          grep -nE 'grab|ragdoll|bump|push|collision|separat' public/js/game/player.js | head -160
          grep -nEi 'mask|guard|patrol|walk|stride' public/js/game/npc.js public/js/game/club.js public/js/char/human.js | head -100
      - run: npm run check
      - run: npm test
      - if: always()
        run: npm run test:network
      - if: always()
        run: npm run test:fire
